<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruiting Intelligence</title><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');:root{--ink:#172033;--muted:#64748b;--line:#e5e7ef;--violet:#6750e8}*{box-sizing:border-box}body{margin:auto;max-width:1100px;padding:32px 26px;background:#f7f8fc;color:var(--ink);font:500 14px Montserrat,Arial,sans-serif}.brand{font-size:26px;font-weight:800;margin-bottom:25px}.brand b{color:var(--violet)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}h2{margin:0 0 14px;font-size:20px}.row,.actions{display:flex;align-items:center;gap:10px}.search input{flex:1}.text-input{min-width:0;padding:13px;border:1px solid #cbd2df;border-radius:10px;font:inherit}button,a,.file-trigger{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:11px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}button:hover,a:hover{background:#2f405f;transform:translateY(-1px);box-shadow:0 5px 12px #17203320}.file-trigger{background:#f0edff;color:#523ec4}.file-trigger:hover{background:#e4defe;transform:translateY(-1px)}.file-trigger input{display:none}.file-name{margin:11px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}.hint,.status,.why{color:var(--muted);font-size:12px}.import{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.candidate{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.top{display:flex;justify-content:space-between}.score{color:#087856;background:#e5f8ef;padding:4px 7px;border-radius:7px;font-size:11px}.progress{display:none;margin-top:15px}.bar{height:5px;background:#eee;border-radius:6px}.bar b{display:block;width:20%;height:100%;background:var(--violet);transition:.3s}@media(max-width:700px){body{padding:20px 14px}.grid,.import{grid-template-columns:1fr}.row{flex-wrap:wrap}.search button{width:100%}}</style><body><div class="brand">Recruiting <b>Intelligence</b></div><section class="card"><h2>Поиск кандидатов</h2><form id="f" class="row search"><input id="q" class="text-input" placeholder="Например: Python-разработчик для AI-проекта" required><button>Найти</button></form><p class="hint">Опиши задачу, стек или навыки обычными словами.</p><div id="p" class="progress"><span id="phase" class="status">Разбираю запрос</span> · <span id="time" class="status">0 сек</span><div class="bar"><b id="bar"></b></div><p id="eta" class="hint">Обычно 10–30 секунд</p></div></section><section class="import"><div class="card"><h2>Добавить базу</h2><form id="uf" class="row"><label class="file-trigger">Выбрать файл<input id="file" type="file" accept=".zip,.json,.jsonl,.csv,.pdf,.txt,.md" required></label><button>Загрузить</button></form><p id="fl" class="file-name">Файл не выбран</p><p id="us" class="status"></p></div><div class="card"><h2>Демо-данные</h2><button id="demo" type="button">Добавить демо</button><p class="file-name">50 профилей добавятся к текущему корпусу.</p><p id="ds" class="status"></p></div></section><h3 id="count"></h3><section id="r" class="grid"></section><script>const api='/api/v1',by=x=>document.getElementById(x);let st,t;const esc=x=>{let d=document.createElement('div');d.textContent=x||'';return d.innerHTML};function load(on){clearInterval(t);by('p').style.display=on?'block':'none';if(!on)return;st=Date.now();t=setInterval(()=>{let s=Math.floor((Date.now()-st)/1000);by('time').textContent=s+' сек';by('bar').style.width=Math.min(92,10+s*3)+'%';by('phase').textContent=s<7?'Разбираю запрос':s<17?'Ищу по навыкам и смыслу':'Ранжирую кандидатов';by('eta').textContent=s<12?'Обычно ещё 10–25 секунд':'Локальная модель ещё работает'},300)}by('f').onsubmit=async e=>{e.preventDefault();load(true);try{let d=await(await fetch(api+'/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:by('q').value,limit:20,generate_answer:false})})).json(),a=[...(d.candidates||[])].sort((x,y)=>y.score-x.score);by('count').textContent=a.length+' кандидатов';by('r').innerHTML=a.map(x=>`<article class="candidate"><div class="top"><b>${esc(x.full_name)}</b><span class="score">${Math.round(x.score*100)}%</span></div><p class="why">${esc((x.reasons||[]).slice(0,2).map(z=>z.claim).join(' · ')||'Семантическое совпадение')}</p><div class="actions"><a href="${api}/candidates/${x.candidate_id}/resume.pdf">PDF</a><a href="${api}/candidates/${x.candidate_id}/resume.docx">Word</a></div></article>`).join('')}finally{load(false)}};by('file').onchange=e=>by('fl').textContent=e.target.files[0]?.name||'Файл не выбран';by('uf').onsubmit=async e=>{e.preventDefault();let f=by('file').files[0],d=new FormData;d.append('file',f);let r=await(await fetch(api+(f.name.endsWith('.zip')?'/ingestion/jobs/upload-archive':'/ingestion/jobs/upload'),{method:'POST',body:d})).json();by('us').textContent=r.detail?'Ошибка: '+r.detail:'Файл принят';by('uf').reset();by('fl').textContent='Файл не выбран'};by('demo').onclick=async()=>{let r=await fetch(api+'/ingestion/jobs/demo',{method:'POST'});by('ds').textContent=r.ok?'Демо поставлено в очередь':'Ошибка'};</script>
