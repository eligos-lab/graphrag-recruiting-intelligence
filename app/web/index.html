<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Recruiting Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:32px;background:#f7f8fc;color:#172033;font:500 14px Montserrat,Arial,sans-serif}.brand{font-size:26px;font-weight:800;margin-bottom:25px}.brand b{color:#6750e8}.card,.candidate{background:#fff;border:1px solid #e5e7ef;border-radius:16px;padding:22px;margin-bottom:18px}.row,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{flex:1;min-width:200px;padding:13px;border:1px solid #cbd2df;border-radius:10px;font:inherit}button,a,.file-trigger{width:160px;text-align:center;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#172033;color:#fff;padding:11px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;transition:.15s;white-space:nowrap}.file-trigger{background:#f0edff;color:#523ec4}.file-trigger input{display:none}button:hover,a:hover{background:#2f405f;transform:translateY(-1px);box-shadow:0 5px 12px #17203320}.file-trigger:hover{background:#e4defe;transform:translateY(-1px)}.hint,.status,.file-name{color:#64748b;font-size:12px}.file-name{margin:11px 0 0;min-height:15px}.import,.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.candidate-name{font-size:17px;font-weight:800}.top{display:flex;justify-content:space-between}.score{color:#087856;background:#e5f8ef;padding:4px 7px;border-radius:7px;font-size:11px}.candidate .actions{margin-top:18px}.progress{display:none;margin-top:15px}.bar{height:5px;background:#eee;border-radius:6px}.bar b{display:block;width:20%;height:100%;background:#6750e8;transition:.3s}@media(max-width:700px){.grid,.import{grid-template-columns:1fr}}
</style>
<body>
<div class="brand">Recruiting <b>Intelligence</b></div>
<section class="card">
  <h2>Поиск кандидатов</h2>
  <form id="f" class="row"><input id="q" placeholder="Например: Python-разработчик для AI-проекта" required><button>Найти</button></form>
  <p class="hint">Опиши задачу, стек или навыки обычными словами.</p>
  <div id="p" class="progress"><span id="phase">Разбираю запрос</span> · <span id="time">0 сек</span><div class="bar"><b id="bar"></b></div><p id="eta" class="hint">Обычно 10–30 секунд</p></div>
</section>
<section class="import">
  <div class="card"><h2>Добавить базу</h2><form id="uf" class="row"><label class="file-trigger">Выбрать файл<input id="file" type="file" required></label><button>Загрузить</button></form><p id="fl" class="file-name"></p><p id="us" class="status"></p></div>
  <div class="card"><h2>Демо-данные</h2><button id="demo">Добавить демо</button><p class="file-name">50 профилей добавятся к текущему корпусу.</p><p id="ds" class="status"></p></div>
</section>
<h3 id="count"></h3><section id="r" class="grid"></section>
<script src="/assets/app.js" defer></script>
</body>
</html>
