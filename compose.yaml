name: graphrag-recruiting

services:
  api:
    build:
      context: .
    environment:
      GRAPHRAG_ENVIRONMENT: local
      GRAPHRAG_DATABASE_URL: postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
      GRAPHRAG_SQL_ECHO: "false"
      GRAPHRAG_CHUNK_MAX_CHARACTERS: ${GRAPHRAG_CHUNK_MAX_CHARACTERS:-2000}
      GRAPHRAG_EMBEDDING_API_KEY: ${GRAPHRAG_EMBEDDING_API_KEY:-}
      GRAPHRAG_EMBEDDING_BASE_URL: ${GRAPHRAG_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      GRAPHRAG_EMBEDDING_MODEL: ${GRAPHRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      GRAPHRAG_EMBEDDING_DIMENSION: ${GRAPHRAG_EMBEDDING_DIMENSION:-1536}
      GRAPHRAG_EMBEDDING_BATCH_SIZE: ${GRAPHRAG_EMBEDDING_BATCH_SIZE:-128}
      GRAPHRAG_EMBEDDING_TIMEOUT_SECONDS: ${GRAPHRAG_EMBEDDING_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphrag}
      POSTGRES_USER: ${POSTGRES_USER:-graphrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphrag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
